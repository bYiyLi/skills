[project]
name = "novelctl"
version = "0.1.0"
description = "Structured knowledge-base CLI for long-form novel projects."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
llamaindex = [
  "llama-index-core>=0.12,<0.13",
]

[project.scripts]
novelctl = "novelctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novelctl"]
