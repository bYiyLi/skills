name: Nexum ChatGPT Development skill

on:
  push:
    paths:
      - 'skills/nexum-chatgpt-development/**'
      - 'tests/nexum-chatgpt-development/**'
      - 'docs/skills/nexum-chatgpt-development.md'
      - 'docs/vlog/**'
      - '.github/workflows/nexum-chatgpt-development.yml'
  pull_request:
    paths:
      - 'skills/nexum-chatgpt-development/**'
      - 'tests/nexum-chatgpt-development/**'
      - 'docs/skills/nexum-chatgpt-development.md'
      - 'docs/vlog/**'
      - '.github/workflows/nexum-chatgpt-development.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install development-only validator
        run: python -m pip install -r tests/nexum-chatgpt-development/requirements.txt
      - name: Validate Agent Skills format
        run: skills-ref validate skills/nexum-chatgpt-development
      - name: Check resources and template outputs
        run: python -m unittest discover -s tests/nexum-chatgpt-development -v
