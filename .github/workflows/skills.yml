name: Agent Skills

on:
  push:
    paths:
      - 'skills/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'skills/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install development-only validator
        run: python -m pip install -r tests/requirements.txt
      - name: Validate all packages, resources and example outputs
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check Nexum-specific resources and template outputs
        run: python -m unittest discover -s tests/nexum-chatgpt-development -v
      - name: Check whitespace
        run: git show --format= --check HEAD
